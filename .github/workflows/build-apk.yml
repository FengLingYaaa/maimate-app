name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes for this build
        required: false
        type: string
        default: Manual build
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.30.5

      - name: Install JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate TypeScript and regression checks
        run: |
          npm run lint
          npm run test:routes
          npm run test:features
          npm run test:phase-af
          npm run test:rating
          npm run test:backup
          npm run test:update

      - name: Validate Expo project and Android export
        run: |
          npx expo-doctor
          npx expo export --platform android

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Build arm64 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Publish tag release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk_path="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name 'MaiMate-*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo 'No release APK found.' >&2
            exit 1
          fi
          echo "MAIMATE_RELEASE_APK=$apk_path" >> "$GITHUB_ENV"
          versioned_apk="${RUNNER_TEMP}/MaiMate-${GITHUB_REF_NAME}.apk"
          latest_apk="${RUNNER_TEMP}/MaiMate-latest.apk"
          cp "$apk_path" "$versioned_apk"
          cp "$apk_path" "$latest_apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$versioned_apk" "$latest_apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$versioned_apk" "$latest_apk" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          # Also place named copies next to the original apk so the artifact step
          # below uploads the versioned and latest filenames alongside it.
          cp "$versioned_apk" "android/app/build/outputs/apk/release/MaiMate-${GITHUB_REF_NAME}.apk"
          cp "$latest_apk" "android/app/build/outputs/apk/release/MaiMate-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MaiMate-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          archive: true

      - name: Print APK checksum
        if: success()
        shell: bash
        run: |
          if [[ -n "${MAIMATE_RELEASE_APK:-}" ]]; then
            sha256sum "$MAIMATE_RELEASE_APK"
          else
            sha256sum android/app/build/outputs/apk/release/*.apk
          fi

      - name: Show build summary
        if: success()
        shell: bash
        run: |
          echo '### MaiMate APK' >> "$GITHUB_STEP_SUMMARY"
          echo '- Artifact: `MaiMate-APK`' >> "$GITHUB_STEP_SUMMARY"
          echo '- ABI: `arm64-v8a`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Package: `cc.flya.maimate`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Signing: debug keystore (internal testing)' >> "$GITHUB_STEP_SUMMARY"
          echo '- SHA-256 (original release APK):' >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${MAIMATE_RELEASE_APK:-}" ]]; then
            sha256sum "$MAIMATE_RELEASE_APK" >> "$GITHUB_STEP_SUMMARY"
          else
            sha256sum android/app/build/outputs/apk/release/*.apk >> "$GITHUB_STEP_SUMMARY"
          fi